[package]
name = "upstage"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "upstage"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
zstd = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
base64 = "0.23.1"
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["trace", "timeout"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

# Strip, thin LTO and one codegen unit keep the release image under the
# 40 MB cap (BC7). Fat LTO is out: the Docker builder has less memory than
# the host, and the linker was killed under it.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
